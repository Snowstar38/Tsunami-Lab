<head>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; }
  #view { position: absolute; left: 0; top: 0; right: 300px; bottom: 0; width: calc(100% - 300px); height: 100%; display: block; }

</style>

<body>
<canvas id="view"></canvas>
<div id="timeline"></div>
<div id="sidebar"></div>
<script src="js/gl.js"></script>

<script src="js/main.js"></script>
</body>
</html>
